[project]
name = "sri-lanka-tax-assistant-api"
version = "0.1.0"
description = "Grounded Sri Lankan tax assistant API and ingestion tooling"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiohttp>=3.14.3",
  "azure-search-documents>=11.6,<12.0",
  "azure-storage-blob>=12.26,<13.0",
  "beautifulsoup4>=4.13,<5.0",
  "defusedxml>=0.7,<1.0",
  "fastapi>=0.116,<1.0",
  "google-genai>=1.30,<2.0",
  "lxml>=6.0,<7.0",
  "openpyxl>=3.1,<4.0",
  "pillow>=11.0,<13.0",
  "pydantic-settings>=2.10,<3.0",
  "pypdf>=6.0,<7.0",
  "pymupdf>=1.26,<2.0",
  "python-dotenv>=1.1,<2.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  # Python wrapper for optional offline OCR; the native tesseract executable is installed separately.
  "pytesseract>=0.3,<1.0",
  "ruff>=0.12,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
